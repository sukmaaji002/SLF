<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Susun laporan kajian Sertifikat Laik Fungsi, lengkapi daftar simak, dan cetak laporan.">
  <meta name="theme-color" content="#193a36">
  <title>Ruang Kajian SLF</title>
  <link rel="stylesheet" href="kajian.css">
  <link rel="stylesheet" href="format-teks.css">
  <script src="format-teks.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="templates.js" defer></script>
  <script src="acuan-simak.js" defer></script>
  <script src="intensitas.js" defer></script>
  <script src="skema-tapak.js" defer></script>
  <script src="laporan.js" defer></script>
  <script src="isian.js" defer></script>
  <script src="contoh-isian.js" defer></script>
  <script src="vendor/paged-0.4.3.min.js" defer></script>
  <script src="pagination.js" defer></script>
  <script src="kajian.js" defer></script>
</head>
<body>
  <header class="mast">
    <div class="mast-inner">
      <a class="logo" href="./index.html" aria-label="Ruang Kajian SLF"><span class="logo-mark" aria-hidden="true">▤</span> Ruang Kajian <strong>SLF</strong></a>
      <a class="standalone" href="./daftar-simak.html">Daftar simak mandiri</a>
    </div>
  </header>
  <main>
    <section class="overview" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Sertifikat Laik Fungsi</p>
        <h1 id="page-title">Editor Kajian SLF</h1>
        <p>Susun laporan bangunan dari sampul hingga daftar simak.</p>
      </div>
      <div class="project-controls">
        <label for="projects">Proyek aktif</label>
        <div class="button-row"><select id="projects"></select><button id="new-project" class="primary" type="button">Proyek baru</button></div>
        <span id="save-status" role="status"></span>
      </div>
    </section>
    <div class="workspace">
      <aside class="sidebar">
        <div class="side-head"><h2>Isi laporan</h2><p id="template-label"></p></div>
        <nav id="outline" aria-label="Isi laporan"></nav>
        <div class="side-actions">
          <button id="add-chapter" class="quiet" type="button">＋ Tambah bab</button>
          <button id="backup" class="quiet" type="button">Unduh cadangan</button>
          <button id="restore" class="quiet" type="button">Impor cadangan</button>
          <input id="backup-file" type="file" accept=".json,application/json" hidden>
        </div>
      </aside>
      <section class="surface" aria-labelledby="section-title">
        <header class="surface-head">
          <div><p id="section-type" class="eyebrow"></p><h2 id="section-title"></h2></div>
          <div class="button-row"><button id="preview" type="button">Pratinjau</button><button id="print" class="primary" type="button">Cetak / PDF</button></div>
        </header>
        <div id="editor" class="editor"></div>
      </section>
    </div>
  </main>
  <dialog id="project-dialog">
    <form id="project-form">
      <h2>Proyek kajian baru</h2>
      <label>Nama proyek<input name="name" required maxlength="120" autocomplete="off"></label>
      <label>Templat laporan<select name="template" required></select></label>
      <p id="template-description"></p>
      <div class="button-row"><button id="project-cancel" type="button">Batal</button><button class="primary" type="submit">Buat proyek</button></div>
    </form>
  </dialog>
  <dialog id="preview-dialog">
    <div class="preview-controls"><strong>Pratinjau laporan</strong><div class="button-row"><button id="close-preview" type="button">Tutup</button><button id="print-preview" class="primary" type="button">Cetak / PDF</button></div></div>
    <article id="report" aria-label="Laporan kajian"></article>
  </dialog>
</body>
</html>
