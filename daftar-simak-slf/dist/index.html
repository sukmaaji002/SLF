<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Susun laporan kajian Sertifikat Laik Fungsi, lengkapi daftar simak, dan cetak laporan.">
  <meta name="theme-color" content="#f3f5f8">
  <title>Ruang Kajian SLF</title>
  <link rel="stylesheet" href="kajian.css">
  <link rel="stylesheet" href="format-teks.css">
  <link rel="stylesheet" href="ruang-kerja.css">
  <link rel="stylesheet" href="akun.css">
  <script src="format-teks.js" defer></script>
  <script src="catalog.js" defer></script>
  <script src="templates.js" defer></script>
  <script src="acuan-simak.js" defer></script>
  <script src="simak-form.js" defer></script>
  <script src="intensitas.js" defer></script>
  <script src="skema-tapak.js" defer></script>
  <script src="laporan.js" defer></script>
  <script src="isian.js" defer></script>
  <script src="contoh-isian.js" defer></script>
  <script src="vendor/paged-0.4.3.min.js" defer></script>
  <script src="pagination.js" defer></script>
  <script src="vendor/supabase-2.119.2.min.js" defer></script>
  <script src="cloud-config.js" defer></script>
  <script src="cloud.js" defer></script>
  <script src="cloud-workspace.js?v=2" defer></script>
  <script src="kajian.js" defer></script>
</head>
<body data-screen="kajian">
  <header class="mast">
    <div class="mast-inner">
      <a class="app-brand" href="./index.html" aria-label="Ruang Kajian SLF"><span class="app-monogram" aria-hidden="true">SLF</span> Ruang Kajian</a>
      <a class="standalone" href="./daftar-simak.html">Daftar simak mandiri</a>
      <div id="cloud-controls" class="cloud-controls" hidden>
        <button id="cloud-login" type="button">Masuk / Daftar</button>
        <span id="cloud-status" role="status" hidden></span>
        <button id="cloud-copy" type="button" hidden>Simpan salinan perubahan</button>
        <button id="cloud-sync" type="button" hidden>Sinkronkan</button>
        <details id="cloud-account" class="cloud-account" hidden>
          <summary><span id="cloud-avatar" class="cloud-avatar" aria-hidden="true"></span> Akun</summary>
          <div class="cloud-account-panel">
            <p id="cloud-email"></p>
            <button id="cloud-logout" class="quiet" type="button">Keluar</button>
          </div>
        </details>
      </div>
    </div>
  </header>
  <main>
    <section class="overview" aria-labelledby="page-title">
      <h1 id="page-title">Editor kajian</h1>
      <div class="project-controls">
        <label for="projects">Proyek</label>
        <div class="button-row"><select id="projects"></select><button id="new-project" class="primary" type="button">Proyek baru</button></div>
        <span id="save-status" role="status"></span>
      </div>
    </section>
    <div class="workspace">
      <aside class="sidebar">
        <details id="section-navigation" open>
          <summary class="section-nav-toggle">Isi laporan</summary>
          <div class="side-head"><p id="template-label"></p></div>
          <nav id="outline" aria-label="Isi laporan"></nav>
          <div class="side-actions">
            <button id="add-chapter" class="quiet" type="button">＋ Tambah bab</button>
            <details class="backup-actions">
              <summary>Cadangan proyek</summary>
              <div>
                <button id="backup" class="quiet" type="button">Unduh cadangan</button>
                <button id="restore" class="quiet" type="button">Impor cadangan</button>
                <input id="backup-file" type="file" accept=".json,application/json" hidden>
              </div>
            </details>
          </div>
        </details>
      </aside>
      <section class="surface" aria-labelledby="section-title">
        <header class="surface-head">
          <div><p id="section-type" class="eyebrow"></p><h2 id="section-title" tabindex="-1"></h2></div>
          <div class="button-row"><button id="preview" type="button">Pratinjau</button><button id="print" class="primary" type="button">Cetak / PDF</button></div>
        </header>
        <div id="editor" class="editor"></div>
      </section>
    </div>
  </main>
  <dialog id="cloud-dialog" aria-labelledby="cloud-dialog-title" aria-describedby="cloud-dialog-description">
    <div class="cloud-auth-layout">
      <div class="cloud-auth-intro">
        <span class="app-monogram" aria-hidden="true">SLF</span>
        <div>
          <strong>Ruang Kajian SLF</strong>
          <p>Lanjutkan draf dan foto di perangkat lain dengan akun yang sama.</p>
        </div>
      </div>
      <form id="cloud-auth">
        <button id="cloud-cancel" type="button" aria-label="Tutup">×</button>
        <div class="cloud-auth-heading">
          <h2 id="cloud-dialog-title">Masuk</h2>
          <p id="cloud-dialog-description"></p>
        </div>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <div id="cloud-password-field" class="cloud-password-field">
          <label>Kata sandi<input id="cloud-password" name="password" type="password" autocomplete="current-password" required></label>
          <button id="cloud-password-toggle" type="button" aria-controls="cloud-password">Lihat sandi</button>
        </div>
        <p id="cloud-auth-message" role="status"></p>
        <button id="cloud-submit" type="submit">Masuk</button>
        <div id="cloud-mode-actions">
          <button class="quiet" type="button" data-auth-mode="login">Kembali ke masuk</button>
          <button class="quiet" type="button" data-auth-mode="signup">Buat akun</button>
          <button class="quiet" type="button" data-auth-mode="recover">Lupa kata sandi?</button>
        </div>
      </form>
    </div>
  </dialog>
  <dialog id="project-dialog">
    <form id="project-form">
      <h2>Proyek kajian baru</h2>
      <label>Nama proyek<input name="name" required maxlength="120" autocomplete="off"></label>
      <label>Templat laporan<select name="template" required></select></label>
      <p id="template-description"></p>
      <div class="button-row"><button id="project-cancel" type="button">Batal</button><button class="primary" type="submit">Buat proyek</button></div>
    </form>
  </dialog>
  <dialog id="chapter-dialog" aria-labelledby="chapter-dialog-title">
    <form id="chapter-form">
      <h2 id="chapter-dialog-title">Tambah bab</h2>
      <label>Judul bab<input name="title" placeholder="Bab baru" autocomplete="off" autofocus></label>
      <label>Posisi bab baru<select name="position" required></select></label>
      <p id="chapter-number-hint" class="hint" aria-live="polite"></p>
      <div class="button-row"><button id="chapter-cancel" type="button">Batal</button><button class="primary" type="submit">Sisipkan bab</button></div>
    </form>
  </dialog>
  <dialog id="preview-dialog">
    <div class="preview-controls"><strong>Pratinjau laporan</strong><div class="button-row"><button id="close-preview" type="button">Tutup</button><button id="print-preview" class="primary" type="button">Cetak / PDF</button></div></div>
    <article id="report" aria-label="Laporan kajian"></article>
  </dialog>
</body>
</html>
